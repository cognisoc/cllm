name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gcc-multilib make qemu-system-x86

      - name: Build kernel
        run: make

      - name: Run host unit tests
        run: make test

      - name: Build llama.cpp host library
        run: make test-llama

      - name: QEMU boot smoke test
        run: make smoke-test

      - name: HTTP integration test
        run: python3 tests/integration/http_smoke.py
